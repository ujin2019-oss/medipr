<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>온케어 · 로컬 디자인 검증</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e8eded; font: 14px/1.5 system-ui, sans-serif; color: #173b43; }
  header { padding: 12px 20px; background: white; position: sticky; top: 0; z-index: 2; }
  button { padding: 7px 12px; margin: 3px; cursor: pointer; }
  #status { display: inline-block; margin-left: 10px; }
  main { display: flex; align-items: flex-start; gap: 20px; padding: 20px; }
  .panel { flex: 0 0 auto; }
  .frame { transform-origin: top left; background: white; border: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  pre { white-space: pre-wrap; }
</style>
<header>
  <button data-view="hero">히어로</button><button data-view="types">검진 유형</button><button data-view="programs">프로그램</button><button data-view="process">절차·소개</button><button data-view="faq">FAQ·푸터</button><button id="run">반응형 검사</button>
  <span id="status">준비 중</span>
</header>
<main>
  <section class="panel" id="desktop"><h2>PC · 1440px</h2><iframe class="frame" title="PC 검증" src="/index.html" width="1440" height="1050"></iframe></section>
  <section class="panel" id="mobile"><h2>Mobile · 390px</h2><iframe class="frame" title="모바일 검증" src="/index.html" width="390" height="950"></iframe></section>
</main>
<script type="module">
  const frames = [...document.querySelectorAll('iframe')];
  function sizePreview() {
    const scale = Math.min(1, (innerWidth - 80) / 1830);
    frames.forEach(frame => {
      frame.style.transform = `scale(${scale})`;
      frame.parentElement.style.width = `${Number(frame.width) * scale}px`;
      frame.parentElement.style.height = `${Number(frame.height) * scale + 30}px`;
    });
  }
  sizePreview();
  addEventListener('resize', sizePreview);
  const selectors = { hero: 'body', types: '.screening-types', programs: '.programs', process: '.process', faq: '.faq' };
  document.querySelectorAll('[data-view]').forEach(button => button.onclick = () => frames.forEach(frame => {
    const target = frame.contentDocument.querySelector(selectors[button.dataset.view]);
    frame.contentWindow.scrollTo({ top: target.getBoundingClientRect().top + frame.contentWindow.scrollY, behavior: 'instant' });
  }));
  async function ready(frame) {
    if (frame.contentDocument.readyState !== 'complete') await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    await frame.contentDocument.fonts.ready;
    await Promise.all([...frame.contentDocument.images].map(image => { image.loading = 'eager'; return image.decode().catch(() => {}); }));
  }
  async function run() {
    document.querySelector('#status').textContent = '반응형 검사 중…';
    const checks = [];
    const frame = frames[0];
    for (const width of [320, 375, 390, 540, 767, 768, 820, 1024, 1199, 1200, 1440, 1920]) {
      frame.width = width;
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      await ready(frame);
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      const overflow = [...doc.body.querySelectorAll('*')].filter(el => {
        if (el.classList.contains('skip-link')) return false;
        const rect = el.getBoundingClientRect();
        return rect.width && (rect.right > width + 1 || rect.left < -1);
      }).map(el => `${el.tagName}.${el.className}`);
      const images = [...doc.images].filter(image => win.getComputedStyle(image).display !== 'none').map(image => ({
        source: image.currentSrc.split('/').pop(), loaded: image.complete && image.naturalWidth > 0,
        naturalWidth: image.naturalWidth, naturalHeight: image.naturalHeight,
        width: image.getBoundingClientRect().width, height: image.getBoundingClientRect().height,
        objectFit: win.getComputedStyle(image).objectFit
      }));
      const sections = [...doc.querySelectorAll('body > header, main > section, body > footer')].map(el => ({
        name: el.className, height: el.getBoundingClientRect().height, top: el.getBoundingClientRect().top + win.scrollY
      }));
      checks.push({ width, scrollWidth: doc.documentElement.scrollWidth, pageHeight: doc.documentElement.scrollHeight, overflow, fontLoaded: doc.fonts.check('700 32px "Noto Sans KR"'), images, sections });
    }
    frame.width = 1440;
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    // The only active destination is the original program CTA; verify its focus behavior.
    const doc = frame.contentDocument;
    doc.querySelector('.hero .button').click();
    const programLinkWorks = doc.activeElement.id === 'programs-title' && frame.contentWindow.location.hash === '#programs';
    frame.contentWindow.scrollTo({ top: 0, behavior: 'instant' });
    const report = { date: new Date().toISOString(), checks, programLinkWorks, pending: ['Subpage source frames', 'Expanded mobile menu', 'FAQ answers'], passed: checks.every(c => !c.overflow.length && c.scrollWidth === c.width && c.fontLoaded && c.images.every(i => i.loaded)) && programLinkWorks };
    await fetch('/__qa/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(report) });
    document.querySelector('#status').textContent = `${report.passed ? '통과' : '실패'} · ${checks.length}개 화면 너비 · 링크·이미지·폰트`;
    sizePreview();
  }
  document.querySelector('#run').onclick = run;
  await Promise.all(frames.map(ready));
  await run();
</script>
</html>
